name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Skill package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test package boundaries and reproducibility
        run: python3 -m unittest discover -s tests -v
      - name: Verify committed distribution matches source
        run: |
          python3 tools/package_skill.py --output "$RUNNER_TEMP/product-security-review.skill"
          cmp dist/product-security-review.skill "$RUNNER_TEMP/product-security-review.skill"
